limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

# Cap concurrent connections per client IP (slowloris / connection-flood defense)
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 80;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide nginx version
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Increase client body size for file uploads
    client_max_body_size 20M;

    # DoS hardening: connection cap + slow-client timeouts
    limit_conn connperip 20;            # max 20 concurrent conns per IP
    limit_conn_status 429;              # return 429, not default 503
    limit_req_status 429;
    client_header_timeout 10s;          # slowloris: drop slow header senders
    client_body_timeout 10s;            # slowloris: drop slow body uploads
    send_timeout 10s;                   # drop clients slow to read response
    keepalive_timeout 15s;              # reclaim idle keepalive conns faster
    reset_timedout_connection on;       # free socket buffers on timeout

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://backend:3000/uploads;
        proxy_set_header Host $host;
        # Cache static uploads
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}
